baseURL = "/"
locale = "en-US"
title = "PosternProxy Documentation"

[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"

[params]
  BookSection = "*"
  BookTheme = "dark"
  BookLogo = "images/logo.png"
  BookToC = true
  BookSearch = true
  BookCollapseSection = true
  BookComments = false
  BookPortableLinks = false
  BookMenuBundle = false
  description = "PosternProxy — a Caddy-powered reverse proxy manager for enterprise infrastructure"

[menu]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github-dark"
    lineNos = false
