name: CI

on:
  push:
    branches: [master, beta-exit, 'codex/**']
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the check's gitleaks scan sees every commit

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: Check installer shell entry points
        run: |
          bash -n scripts/install.sh scripts/install-agent.sh scripts/build.sh scripts/install_test.sh
          bash scripts/install_test.sh

      - name: Check (format, vet, lint, complexity, size, tests, security)
        run: go run ./scripts/check -go -race

      - name: Build controller and agent
        run: go build ./cmd/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check (install, type-check, lint, build, audit)
        run: go run ./scripts/check -frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        working-directory: frontend
        run: npm run test:e2e

  caddy-acceptance:
    name: Pinned Caddy traffic
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify pinned Caddy
        run: |
          bash internal/caddybuild/build_test.sh
          . internal/caddybuild/build.sh
          build_caddy "$RUNNER_TEMP/caddy"
          verify_caddy "$RUNNER_TEMP/caddy"

      - name: Build native acceptance agent
        run: go build -o "$RUNNER_TEMP/posternproxy-agent" ./cmd/posternproxy-agent

      - name: Test traffic and two-agent restart reconciliation
        env:
          POSTERNPROXY_TEST_CADDY: ${{ runner.temp }}/caddy
          POSTERNPROXY_TEST_AGENT: ${{ runner.temp }}/posternproxy-agent
        run: go test -tags=integration -count=1 -v ./internal/caddy ./internal/services

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.163.1
          extended: true

      - name: Build documentation
        run: hugo --gc --minify
