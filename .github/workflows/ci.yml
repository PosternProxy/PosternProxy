name: CI

on:
  push:
    branches: [master, beta-exit, 'codex/**']
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module checksums
        run: go mod verify

      - name: Check installer shell entry points
        run: |
          bash -n scripts/install.sh scripts/install-agent.sh scripts/build.sh scripts/install_test.sh
          bash scripts/install_test.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build controller and agent
        run: go build ./cmd/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Set up Go for the disposable browser controller
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  caddy-acceptance:
    name: Pinned Caddy traffic
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify pinned Caddy
        run: |
          bash internal/caddybuild/build_test.sh
          . internal/caddybuild/build.sh
          build_caddy "$RUNNER_TEMP/caddy"
          verify_caddy "$RUNNER_TEMP/caddy"

      - name: Build native acceptance agent
        run: go build -o "$RUNNER_TEMP/posternproxy-agent" ./cmd/posternproxy-agent

      - name: Test traffic and two-agent restart reconciliation
        env:
          POSTERNPROXY_TEST_CADDY: ${{ runner.temp }}/caddy
          POSTERNPROXY_TEST_AGENT: ${{ runner.temp }}/posternproxy-agent
        run: go test -tags=integration -count=1 -v ./internal/caddy ./internal/services

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.163.1
          extended: true

      - name: Build documentation
        run: hugo --gc --minify
